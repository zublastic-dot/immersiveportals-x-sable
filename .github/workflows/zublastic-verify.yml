name: Zublastic regression tests
on:
  pull_request:
  push:
    branches: ['0.5.0']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - dh: '3.3.2'
            artifact: Ez3cx7Yd
          - dh: '3.3.3'
            artifact: 9w34y8ai
    name: Regression tests (DH ${{ matrix.dh }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test against the supported DH artifact
        run: bash gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2G -PdhCompileVersion=${{ matrix.artifact }} test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-test-results-dh-${{ matrix.dh }}
          path: build/test-results/test/
