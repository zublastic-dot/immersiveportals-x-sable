name: Zublastic chunk-ticket regression tests
on:
  pull_request:
  push:
    branches: ['0.5.0']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test the production scheduler
        run: bash gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2G test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chunk-ticket-test-results
          path: build/test-results/test/
